name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare Windows test storage
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "D:\DevData" | Out-Null
      - name: Test and build release package
        shell: pwsh
        run: ./scripts/package-release.ps1 -OutputName "RoleFlow-${{ github.ref_name }}.zip"
      - name: Create prerelease and upload package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $notes = Get-Content -LiteralPath "docs/releases/$env:GITHUB_REF_NAME.md" -Raw -Encoding utf8
          $payload = @{
            tag_name = $env:GITHUB_REF_NAME
            name = "RoleFlow $env:GITHUB_REF_NAME"
            body = $notes
            draft = $false
            prerelease = $true
          } | ConvertTo-Json
          $release = Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $payload
          $assetName = "RoleFlow-$env:GITHUB_REF_NAME.zip"
          $uploadUrl = $release.upload_url.Replace("{?name,label}", "?name=$([uri]::EscapeDataString($assetName))")
          Invoke-RestMethod `
            -Method Post `
            -Uri $uploadUrl `
            -Headers $headers `
            -ContentType "application/zip" `
            -InFile "dist/$assetName"
