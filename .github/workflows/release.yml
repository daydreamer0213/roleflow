name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare Windows test storage
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "D:\DevData" | Out-Null
      - name: Validate release version
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath "package.json" -Raw -Encoding utf8 | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($package.version)") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $($package.version)."
          }
      - name: Prepare portable Node runtime
        shell: pwsh
        run: |
          $nodeRoot = Split-Path -Parent (Get-Command node -ErrorAction Stop).Source
          New-Item -ItemType Directory -Force -Path ".runtime" | Out-Null
          Copy-Item `
            -LiteralPath $nodeRoot `
            -Destination ".runtime\node" `
            -Recurse `
            -Force
      - name: Test and build release package
        shell: pwsh
        run: ./scripts/package-release.ps1 -IncludePortableNode -OutputName "RoleFlow-${{ github.ref_name }}-portable.zip"
      - name: Verify portable package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = "dist/RoleFlow-$env:GITHUB_REF_NAME-portable.zip"
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace("/", "\") })
            foreach ($required in @(
              "Install.bat",
              "Start.bat",
              "ScanPortable.bat",
              "StartPortableEdge.bat",
              ".runtime\node\node.exe"
            )) {
              if ($entries -notcontains $required) {
                throw "Portable package is missing $required."
              }
            }
            $forbidden = @($entries | Where-Object {
              $_ -match "^(data\\jobs\.sqlite([^\\]*)?|vendor\\edge-control-bridge|\.runtime\\edge-profile|\.runtime\\secrets|logs)(\\|$)" -or
              $_ -match "\.key$"
            })
            if ($forbidden.Count -gt 0) {
              throw "Portable package contains forbidden runtime data: $($forbidden[0])"
            }
          } finally {
            $archive.Dispose()
          }
      - name: Verify Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) {
            throw "Inno Setup 6 compiler is unavailable on the selected GitHub runner."
          }
          $version = (Get-Item -LiteralPath $compiler).VersionInfo.ProductVersion
          Write-Output "Using Inno Setup $version at $compiler"
          "ROLEFLOW_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build standard installer
        shell: pwsh
        run: |
          $nodeRoot = Split-Path -Parent (Get-Command node -ErrorAction Stop).Source
          ./scripts/build-installer.ps1 `
            -OutputDir (Join-Path $PWD "dist") `
            -PortableNodeRoot $nodeRoot `
            -SkipTests
      - name: Create release and upload packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $package = Get-Content -LiteralPath "package.json" -Raw -Encoding utf8 | ConvertFrom-Json
          $isPrerelease = $package.version -match "-"
          $notes = Get-Content -LiteralPath "docs/releases/$env:GITHUB_REF_NAME.md" -Raw -Encoding utf8
          $payload = @{
            tag_name = $env:GITHUB_REF_NAME
            name = "RoleFlow $env:GITHUB_REF_NAME"
            body = $notes
            draft = $true
            prerelease = $isPrerelease
          } | ConvertTo-Json
          $releases = @(
            Invoke-RestMethod `
              -Method Get `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100" `
              -Headers $headers
          )
          $release = $releases | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME } | Select-Object -First 1
          if ($release -and -not $release.draft) {
            throw "Release $env:GITHUB_REF_NAME is already published; refusing to replace it."
          }
          if ($release) {
            foreach ($asset in @($release.assets)) {
              Invoke-RestMethod `
                -Method Delete `
                -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" `
                -Headers $headers
            }
            $release = Invoke-RestMethod `
              -Method Patch `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" `
              -Headers $headers `
              -ContentType "application/json" `
              -Body $payload
          } else {
            $release = Invoke-RestMethod `
              -Method Post `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" `
              -Headers $headers `
              -ContentType "application/json" `
              -Body $payload
          }
          $assetPaths = @(
            "dist/RoleFlow-$env:GITHUB_REF_NAME-portable.zip",
            "dist/RoleFlow-Setup-$($package.version).exe",
            "dist/RoleFlow-Setup-$($package.version).exe.sha256"
          )
          foreach ($assetPath in $assetPaths) {
            $assetName = [System.IO.Path]::GetFileName($assetPath)
            $contentType = if ($assetName.EndsWith(".zip")) {
              "application/zip"
            } elseif ($assetName.EndsWith(".exe")) {
              "application/vnd.microsoft.portable-executable"
            } else {
              "text/plain"
            }
            $uploadUrl = $release.upload_url.Replace(
              "{?name,label}",
              "?name=$([uri]::EscapeDataString($assetName))"
            )
            Invoke-RestMethod `
              -Method Post `
              -Uri $uploadUrl `
              -Headers $headers `
              -ContentType $contentType `
              -InFile $assetPath
          }
          $publishPayload = @{
            draft = $false
            prerelease = $isPrerelease
          } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Patch `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $publishPayload
